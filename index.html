<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Emotiva Día de la Madre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Georgia', serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-section {
            position: relative;
            height: 300px;
            background: linear-gradient(135deg, #ffd6e8 0%, #ffe0ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .illustration {
            font-size: 12rem;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .decorative-flower {
            position: absolute;
            font-size: 2.5rem;
            animation: spin 6s linear infinite;
        }

        .flower-top-left {
            top: 20px;
            left: 20px;
            animation-delay: 0s;
        }

        .flower-top-right {
            top: 30px;
            right: 20px;
            animation-delay: 1s;
        }

        .flower-bottom-left {
            bottom: 20px;
            left: 30px;
            animation-delay: 2s;
        }

        .flower-bottom-right {
            bottom: 30px;
            right: 20px;
            animation-delay: 3s;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .content-section {
            padding: 50px 35px 45px;
            text-align: center;
        }

        .title {
            font-size: 2.3rem;
            color: #d946a6;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
            animation: fadeInText 1s ease-out 0.2s both;
        }

        .phrase {
            font-size: 1.15rem;
            color: #6b5b7f;
            line-height: 2;
            margin: 30px 0;
            font-style: italic;
            font-weight: 500;
            animation: fadeInText 1s ease-out 0.4s both;
        }

        .heart-divider {
            font-size: 1.5rem;
            color: #ff69b4;
            margin: 25px 0;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.8;
            }
        }

        .signature {
            font-size: 0.95rem;
            color: #d946a6;
            font-weight: bold;
            margin-top: 25px;
            animation: fadeInText 1s ease-out 0.6s both;
        }

        .button {
            margin-top: 25px;
            padding: 12px 40px;
            background: linear-gradient(135deg, #d946a6 0%, #ec4899 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(217, 70, 166, 0.4);
            animation: fadeInText 1s ease-out 0.8s both;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(217, 70, 166, 0.6);
        }

        .button:active {
            transform: translateY(-1px);
        }

        @keyframes fadeInText {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        .sparkle-1 {
            top: 50px;
            left: 40%;
            animation-delay: 0s;
        }

        .sparkle-2 {
            top: 150px;
            right: 10%;
            animation-delay: 0.5s;
        }

        .sparkle-3 {
            bottom: 60px;
            left: 15%;
            animation-delay: 1s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Sección de Imagen -->
        <div class="image-section">
            <div class="sparkles">
                <div class="sparkle-dot sparkle-1"></div>
                <div class="sparkle-dot sparkle-2"></div>
                <div class="sparkle-dot sparkle-3"></div>
            </div>
            
            <div class="decorative-flower flower-top-left">🌹</div>
            <div class="decorative-flower flower-top-right">🌸</div>
            <div class="decorative-flower flower-bottom-left">🌺</div>
            <div class="decorative-flower flower-bottom-right">🌼</div>
            
            <div class="illustration">👩‍👧‍👦</div>
        </div>

        <!-- Sección de Contenido -->
        <div class="content-section">
            <h1 class="title">Feliz Día Mamá</h1>
            
            <div class="heart-divider">💕</div>
            
            <p class="phrase">
                "Eres el amor sin condiciones,<br>
                la fuerza en cada momento,<br>
                y la razón de nuestras sonrisas.<br>
                Infinita admiración y gratitud."
            </p>
            
            <p class="signature">Te amamos hoy y siempre ❤️</p>
            
            <button class="button">Especial para ti</button>
        </div>
    </div>
</body>
</html>
